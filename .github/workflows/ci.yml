name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -ra

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: student-records-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and check the API responds
        run: |
          docker run -d --name api -p 8000:8000 student-records-api:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health | grep '"status":"ok"'
          curl -fsS -X POST http://localhost:8000/students \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Check","email":"ci@example.com"}' | grep '"id":1'
          curl -fsS http://localhost:8000/students | grep 'CI Check'

      - name: Show container logs
        if: always()
        run: docker logs api || true

      - name: Stop container
        if: always()
        run: docker rm -f api || true
